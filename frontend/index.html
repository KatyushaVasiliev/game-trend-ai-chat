<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Pulse AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chat-format.css"></head><body>
<header><div><small>DATA-POWERED AI</small><h1>Game Pulse</h1></div><span id="storage-status">연결 확인 중</span></header>
<main>
  <aside><section><h2>데이터 요약</h2><div id="summary" class="summary">불러오는 중…</div></section><section><h2>대화 기록</h2><button id="new-chat" class="secondary">+ 새 대화</button><div id="history"></div></section></aside>
  <section class="chat-panel"><div class="panel-head"><div><small>AI ANALYST</small><h2>게임 관심도에게 물어보세요</h2></div><span class="badge">컨텍스트 주입</span></div><div id="messages" class="messages"><article class="message assistant">저장된 시계열 요약을 기반으로 답변합니다. 예: “최근 게임 관심도 추세는 어떤가요?”</article></div><form id="chat-form"><input id="question" required maxlength="2000" placeholder="질문을 입력하세요"><button>전송</button></form><p class="hint">Render 무료 인스턴스는 첫 요청에 약간의 시간이 걸릴 수 있습니다.</p></section>
  <section class="data-panel"><div class="panel-head"><div><small>FIRESTORE CRUD</small><h2>관측 데이터 관리</h2></div></div><form id="data-form" class="data-form"><input id="data-date" type="date" required><input id="data-value" type="number" min="0" step="0.1" placeholder="값" required><input id="data-memo" maxlength="280" placeholder="메모" required><button id="data-submit">추가</button><button id="cancel-edit" type="button" class="secondary" hidden>취소</button></form><div id="data-list" class="data-list"></div></section>
</main><template id="row-template"><div class="data-row"><span class="date"></span><strong class="value"></strong><span class="memo"></span><button class="edit secondary">수정</button><button class="delete danger">삭제</button></div></template><script src="config.js"></script><script src="app.js"></script></body></html>
